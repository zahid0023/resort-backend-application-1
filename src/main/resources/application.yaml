spring:
  jackson:
    default-property-inclusion: non_null
  flyway:
    out-of-order: true

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 16

app:
  # Placeholder — the customer-facing portal isn't built yet. Referenced in welcome/notification messages
  # (see ResortBookingController) so customers know where to eventually log in and track their booking.
  customer-portal-base-url: ${CUSTOMER_PORTAL_BASE_URL:https://portal.test.com}

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET_must_be_set}
  access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:?JWT_ACCESS_EXPIRATION_MINUTES must be set!}
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:?JWT_REFRESH_EXPIRATION_DAYS must be set!}
  otp.expiration-minutes: ${OTP_EXPIRATION_MINUTES:?OTP_EXPIRATION_MINUTES must be set!}

springdoc:
  swagger-ui:
    persist-authorization: true